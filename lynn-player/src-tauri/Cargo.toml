[package]
name = "lynn-player"
version = "0.0.15"
description = "Lynn Player - A media player with local music, video, and online music support"
authors = ["Lynn Player Team"]
edition = "2021"

[lib]
name = "lynn_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mp4 = "0.14"
rusqlite = { version = "0.30", features = ["bundled"] }
walkdir = "2"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
lofty = "0.20"
anyhow = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
lru = "0.12"
dirs = "5.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_SystemInformation"] }
